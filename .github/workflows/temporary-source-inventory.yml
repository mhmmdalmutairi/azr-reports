name: Temporary canonical-source inventory

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory possible visual identity sources
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path(".")
          skip_dirs = {".git", "node_modules", ".venv", "venv", "__pycache__"}
          path_terms = re.compile(r"(brand|identity|design.?system|token|template|theme|style|guideline|slide|deck|report|font|logo|asset|visual|هوية|قالب)", re.I)
          content_terms = re.compile(r"(آزر|AZR|azr-design-system|Thmanyah|ثمانية|font-family|--(?:cream|purple|violet|coral)|#967BB6|#5B3CC4|#E8530E|brand|design system|visual identity|الهوية البصرية|مصدر الحقيقة)", re.I)
          text_ext = {".md",".txt",".json",".json5",".yaml",".yml",".toml",".ini",".cfg",".conf",".css",".scss",".sass",".less",".html",".htm",".js",".mjs",".cjs",".ts",".tsx",".jsx",".py",".sh",".rb",".go",".rs",".java",".kt",".xml",".svg",".vue",".svelte"}
          all_files, candidates = [], []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              rel = path.as_posix().removeprefix("./")
              all_files.append(rel)
              reasons = []
              if path_terms.search(rel):
                  reasons.append("path")
              if path.suffix.lower() in text_ext and path.stat().st_size <= 10_000_000:
                  try:
                      text = path.read_text(encoding="utf-8", errors="ignore")
                  except OSError:
                      text = ""
                  hits = sorted(set(m.group(0) for m in content_terms.finditer(text)), key=str.lower)
                  if hits:
                      reasons.append("content:" + ",".join(hits[:20]))
              if reasons:
                  candidates.append({"path": rel, "size": path.stat().st_size, "reasons": reasons})
          Path("audit").mkdir()
          Path("audit/all-files.txt").write_text("\n".join(all_files)+"\n", encoding="utf-8")
          Path("audit/candidates.json").write_text(json.dumps(candidates, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(f"ALL_FILES={len(all_files)} CANDIDATES={len(candidates)}")
          print(json.dumps(candidates, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-source-inventory
          path: audit/
